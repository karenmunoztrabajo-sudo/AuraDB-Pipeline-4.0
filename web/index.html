<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>AuraDB</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #667085;
      --border: #d6dde6;
      --accent: #087568;
      --accent-strong: #065f55;
      --soft: #edf7f5;
      --danger: #b42318;
      --danger-soft: #fff3f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f8fa;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      width: 100%;
      border-radius: 8px;
      font: inherit;
    }

    input,
    textarea {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 12px;
    }

    input:focus,
    textarea:focus {
      outline: none;
      box-shadow: none;
      border-color: var(--border);
    }

    textarea {
      min-height: 48px;
      resize: vertical;
      line-height: 1.5;
    }

    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      padding: 11px 12px;
    }

    button:hover {
      background: var(--accent-strong);
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    h3 {
      margin: 0;
      font-size: 16px;
    }

    .hidden {
      display: none !important;
    }

    .login-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.08);
    }

    .login-card h1 {
      margin-bottom: 8px;
    }

    .login-card p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .login-card input {
      margin-bottom: 10px;
    }

    .app {
      width: min(1280px, calc(100% - 24px));
      height: 100vh;
      margin: 0 auto;
      padding: 10px 0 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex: 0 0 auto;
      height: 40px;
      margin-bottom: 6px;
    }

    .topbar-actions {
      position: relative;
      width: auto;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .new-chat-button {
      width: auto;
      min-height: 34px;
      padding: 8px 11px;
      border-color: #d8e3e0;
      background: #ffffff;
      color: var(--text);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .new-chat-button:hover {
      background: #f1f5f9;
    }

    .menu-button {
      width: 38px;
      height: 38px;
      padding: 0;
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
      font-size: 20px;
      line-height: 1;
    }

    .menu-button:hover {
      background: #f1f5f9;
    }

    .session-menu {
      position: absolute;
      top: 44px;
      right: 0;
      z-index: 20;
      width: 180px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.12);
    }

    .session-menu button {
      margin: 0;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
    }

    .session-menu button:hover {
      background: #f4f7f7;
    }

    .workspace {
      display: flex;
      align-items: stretch;
      gap: 14px;
      min-height: 0;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .workspace.history-open {
      display: flex;
    }

    .main-panel {
      min-width: 0;
      flex: 1 1 auto;
      width: auto;
      padding: 0;
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .history-panel {
      position: static;
      flex: 0 0 340px;
      width: 340px;
      min-width: 0;
      padding: 16px;
      height: 100%;
      max-height: none;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 18px 42px rgba(15, 23, 42, 0.14);
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .history-panel.hidden-desktop {
      display: none;
    }

    .panel-intro {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 15px;
    }

    .intro-block {
      display: none;
    }

    .intro-block h2 {
      margin: 0 0 2px;
      font-size: 18px;
      line-height: 1.2;
    }

    .intro-block p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .secondary-button {
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .secondary-button:hover {
      background: #f1f5f9;
    }

    .compact-button {
      width: auto;
      min-height: 32px;
      padding: 7px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.15;
    }

    .danger-button {
      border-color: #f0b8b2;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .danger-button:hover {
      background: #fde7e4;
    }

    .ghost-action {
      width: auto;
      padding: 8px 10px;
      border: 1px solid #d8e3e0;
      border-radius: 10px;
      background: #f8fbfb;
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .ghost-action:hover {
      background: #eef5f4;
    }

    .ghost-action.danger {
      color: var(--danger);
      border-color: #f0d4cf;
      background: #fff8f7;
    }

    .ghost-action.danger:hover {
      background: #fff0ee;
    }

    .composer {
      flex: 0 0 auto;
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #ffffff;
      overflow: visible;
      box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
    }

    .composer-doc-row {
      display: flex;
      align-items: center;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    .composer-input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      width: 100%;
    }

    .composer-head {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 16px 0;
    }

    .composer-label {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }

    .composer-hint {
      margin: 2px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .composer-badge {
      width: auto;
      padding: 6px 10px;
      border: 1px solid #d7ebe6;
      border-radius: 999px;
      background: var(--soft);
      color: var(--accent-strong);
      font-size: 12px;
      font-weight: 700;
    }

    .composer textarea {
      flex: 1 1 auto;
      width: auto;
      min-width: 120px;
      border: 0;
      border-radius: 12px;
      display: block;
      min-height: 48px;
      max-height: 120px;
      padding: 12px 10px;
      font-size: 15px;
      resize: none;
      overflow-y: auto;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1 1 auto;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      min-height: 0;
    }

    .example-row {
      display: none;
      flex-wrap: nowrap;
      gap: 8px;
      padding: 0 10px 8px;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .example-chip {
      width: auto;
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid #d4e5e0;
      border-radius: 999px;
      background: #f7fbfa;
      color: #29434e;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .example-chip:hover {
      background: #edf7f5;
      border-color: #b7d8cf;
    }

    .file-area {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: nowrap;
      flex: 1 1 auto;
      overflow: hidden;
    }

    .file-area button {
      width: auto;
      white-space: nowrap;
    }

    .attach-button {
      width: 40px;
      min-width: 40px;
      height: 40px;
      padding: 0;
      border-radius: 12px;
      border-color: #b7d8cf;
      background: var(--soft);
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0;
      line-height: 1;
    }

    .attach-button:hover {
      border-color: var(--accent);
      background: #dff2ee;
      color: var(--accent-strong);
    }

    .attach-button svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    input[type=file] {
      display: none !important;
    }

    .file-status {
      display: none;
      min-width: 0;
      max-width: 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .document-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      width: auto;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .document-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex: 0 0 auto;
      max-width: 170px;
      padding: 4px 7px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fbfcfd;
      color: var(--text);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.2;
    }

    .document-pill-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .document-remove {
      width: 18px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      line-height: 1;
    }

    .document-remove:hover {
      background: #eef2f5;
      color: var(--danger);
    }

    .query-action {
      width: auto;
      min-width: 68px;
      flex: 0 0 auto;
      align-self: stretch;
    }

    .status {
      margin-top: 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .composer .status {
      display: none;
    }

    .composer .status.error,
    .composer .status.processing {
      display: inline-flex;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status.ready {
      color: var(--accent-strong);
      font-weight: 700;
    }

    .status.processing {
      color: #7a5c00;
      font-weight: 700;
    }

    .chat-thread {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      overflow-y: auto;
      padding: 18px 2px 24px;
      scroll-behavior: smooth;
    }

    .chat-empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: #98a2b3;
      text-align: center;
      font-size: 15px;
    }

    .chat-message {
      display: flex;
      margin: 14px 0;
    }

    .chat-message.user {
      justify-content: flex-end;
    }

    .chat-message.assistant {
      justify-content: flex-start;
    }

    .chat-bubble {
      width: fit-content;
      max-width: min(760px, 84%);
      padding: 11px 13px;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      overflow-wrap: anywhere;
      box-shadow: none;
    }

    .chat-message.user .chat-bubble {
      background: #e4ebf3;
      color: #17202a;
      padding: 13px 16px;
      border-radius: 20px;
      border-bottom-right-radius: 8px;
    }

    .chat-message.assistant .chat-bubble {
      background: #ffffff;
      color: #20303c;
      border-bottom-left-radius: 6px;
    }

    .chat-text {
      margin: 0;
      white-space: pre-wrap;
      line-height: 1.68;
      font-size: 15px;
    }

    .typing-cursor {
      display: inline-block;
      width: 7px;
      margin-left: 2px;
      color: var(--accent);
      animation: cursorBlink 900ms steps(1) infinite;
    }

    @keyframes cursorBlink {
      0%, 45% {
        opacity: 1;
      }
      46%, 100% {
        opacity: 0;
      }
    }

    .error {
      color: var(--danger);
      font-weight: 700;
    }

    .history-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .history-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .history-list {
      margin-top: 12px;
    }

    .history-card {
      position: relative;
      margin-top: 10px;
      padding: 14px 14px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: linear-gradient(180deg, #ffffff 0%, #fcfdfd 100%);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.05);
    }

    .history-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .history-question {
      margin: 0;
      font-size: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      font-weight: 700;
      line-height: 1.35;
    }

    .history-item-menu {
      position: relative;
      width: auto;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-favorite {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #dbe6e2;
      border-radius: 999px;
      background: #fbfdfd;
      color: #9aa8b2;
      font-size: 14px;
      line-height: 1;
    }

    .history-favorite:hover {
      background: #f3f8f7;
    }

    .history-favorite.active {
      color: #c68b00;
      border-color: #f1d48a;
      background: #fff8df;
    }

    .history-menu-button {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #d8e3e0;
      border-radius: 10px;
      background: #f9fbfb;
      color: var(--text);
      font-size: 18px;
      line-height: 1;
    }

    .history-menu-button:hover {
      background: #f0f5f4;
    }

    .history-context-menu {
      position: absolute;
      top: 40px;
      right: 0;
      z-index: 20;
      width: 146px;
      padding: 6px;
      border: 1px solid #d8e3e0;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.14);
    }

    .history-context-menu button {
      margin: 0;
      padding: 7px 9px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.2;
      text-align: left;
      color: var(--text);
    }

    .history-context-menu button:hover {
      background: #f4f7f7;
    }

    .history-context-menu .danger-button {
      color: var(--danger);
      background: transparent;
    }

    .history-context-menu .danger-button:hover {
      background: #fff3f1;
    }

    .history-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .answer-panel {
      width: 100%;
      max-width: min(780px, 100%);
      align-self: stretch;
      margin-top: 0;
      padding: 2px 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: auto;
      animation: answerEnter 220ms ease-out;
    }

    @keyframes answerEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-head {
      display: none;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      margin-bottom: 16px;
    }

    .answer {
      margin: 0;
      width: 100%;
      max-width: none;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 16px;
      line-height: 1.72;
      color: #20303c;
    }

    .formatted-answer {
      display: grid;
      gap: 18px;
      max-width: 74ch;
    }

    .formatted-block {
      padding-top: 18px;
      border-top: 1px solid #e3ebe8;
    }

    .formatted-block:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .formatted-heading {
      margin: 0 0 12px;
      color: var(--accent-strong);
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .formatted-paragraph {
      margin: 0 0 16px;
      overflow-wrap: anywhere;
      color: #20303c;
      font-size: 16px;
      line-height: 1.9;
    }

    .formatted-paragraph:last-child {
      margin-bottom: 0;
    }

    .formatted-list {
      margin: 0;
      padding-left: 22px;
      color: #20303c;
      font-size: 16px;
      line-height: 1.86;
    }

    .formatted-list li {
      margin: 0 0 12px;
      padding-left: 6px;
    }

    .formatted-list li:last-child {
      margin-bottom: 0;
    }

    .long-answer {
      gap: 22px;
    }

    .long-answer .formatted-block {
      padding-top: 22px;
    }

    .long-answer .formatted-heading {
      margin-bottom: 14px;
      font-size: 18px;
      color: #075f56;
    }

    .long-answer .formatted-paragraph,
    .long-answer .formatted-list {
      font-size: 16px;
      line-height: 1.95;
    }

    .answer-section {
      padding: 14px 0;
      border-top: 1px solid #e3ebe8;
    }

    .answer-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .answer-label {
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .answer-question {
      margin: 0;
      color: var(--text);
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .answer-title {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--accent);
    }

    .answer-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .answer-action {
      width: auto;
      padding: 7px 10px;
      border: 1px solid #d4e5e0;
      border-radius: 999px;
      background: #f7fbfa;
      color: #29434e;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.2;
    }

    .answer-action:hover {
      background: #edf7f5;
      border-color: #b7d8cf;
    }

    .answer-feedback {
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      min-height: 16px;
    }

    .loading-inline {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    .loading-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #9fc7be;
      animation: pulseDot 1.1s infinite ease-in-out;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .loading-dots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulseDot {
      0%, 80%, 100% {
        transform: scale(0.7);
        opacity: 0.55;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .muted {
      color: var(--muted);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.42);
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 1000;
    }

    .modal-card {
      width: min(420px, 100%);
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 20px 48px rgba(15, 23, 42, 0.18);
    }

    .modal-card p {
      margin: 0 0 18px;

    .modal-actions {

      grid-template-columns: 1fr 1fr;

    @media (max-width: 1100px) {

    }

    @media (max-width: 880px) {

      .composer-footer {

        flex-direction: row;
        flex-wrap: nowrap;
      }

        width: auto;
      }

    @media (max-width: 760px) {

        position: fixed;

        left: 16px;

  </style>
</head>
<body>
<section id="loginView" class="login-shell hidden">
  <div class="login-card">
    <h1>AuraDB</h1>
    <p>Ingresa para consultar tus documentos.</p>
    <input id="loginEmail" type="email" placeholder="Email" autocomplete="email" />
    <input id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password" />
    <button onclick="login()">Ingresar</button>
    <div id="loginResult" class="status"></div>
  </div>
</section>

<main id="appView" class="app hidden">
  <header class="topbar">
    <h1>AuraDB</h1>
    <div class="topbar-actions">
      <button type="button" class="new-chat-button" onclick="startNewChat()">Nuevo chat</button>
      <button type="button" class="menu-button" onclick="toggleSessionMenu()" aria-label="Menú">⋯</button>
      <div id="sessionMenu" class="session-menu hidden">
        <button type="button" onclick="startNewChat()">Nuevo chat</button>
        <button type="button" onclick="toggleHistoryPanel()">Historial</button>
        <button type="button" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div id="workspace" class="workspace">
    <section class="main-panel" id="queryPanel">
      <div id="askResult" class="chat-thread">
        <div class="chat-empty">Haz una pregunta para iniciar la conversación.</div>
      </div>

      <div class="composer">
        <div class="composer-doc-row">
          <div class="file-area">
            <input type="file" id="file" multiple hidden />
            <span id="currentDocumentName" class="file-status">Consulta global en la base de conocimiento</span>
            <div id="documentList" class="document-list"></div>
            <div id="uploadResult" class="status"></div>
          </div>
        </div>
        <div class="composer-input-row">
          <button type="button" id="uploadButton" class="secondary-button compact-button attach-button" title="Adjuntar documento" aria-label="Adjuntar documento">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M21.4 11.6 12 21a6 6 0 0 1-8.5-8.5l9.8-9.8a4 4 0 0 1 5.7 5.7l-9.8 9.8a2 2 0 1 1-2.8-2.8l9.4-9.4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <textarea id="askQuery" placeholder="Pregúntame algo sobre tus documentos..."></textarea>
          <button type="button" id="askButton" class="query-action compact-button" onclick="handleAskButtonClick()">Enviar</button>
        </div>
      </div>
    </section>

    <aside id="historyPanel" class="history-panel hidden-desktop">
      <div class="history-panel-head">
        <h3>Historial</h3>
        <div class="history-top-actions">
          <button type="button" class="ghost-action danger" onclick="requestClearHistory()">Vaciar historial</button>
          <button type="button" class="ghost-action" onclick="loadAskHistory()">Actualizar</button>
        </div>
      </div>
      <div id="historyResult" class="history-list"></div>
    </aside>
  </div>
</main>

<div id="confirmModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmModalText">
  <div class="modal-card">
    <p id="confirmModalText">¿Seguro que quieres eliminar esta pregunta del historial?</p>
    <div class="modal-actions">
      <button type="button" class="secondary-button" onclick="closeConfirmModal()">Cancelar</button>
      <button type="button" class="danger-button" onclick="confirmDeleteHistory()">Eliminar</button>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:8080";
const AUTH_TOKEN_KEY = "auradb.authToken";
const TENANT_ID = "14168b79-719b-4578-832a-d571bc2da2d5";
const CURRENT_DOCUMENT_ID_KEY = "auradb.currentDocumentId";
const CURRENT_DOCUMENT_NAME_KEY = "auradb.currentDocumentName";
const CURRENT_DOCUMENTS_KEY = "auradb.currentDocuments";
const CURRENT_QUERY_TEXT_KEY = "auradb.currentQueryText";
const LAST_ANSWER_TEXT_KEY = "auradb.lastAnswerText";
const HISTORY_FAVORITES_KEY = "auradb.historyFavorites";
const HISTORY_HIDDEN_IDS_KEY = "auradb.historyHiddenIds";
const HISTORY_PANEL_OPEN_KEY = "auradb.historyPanelOpen";

let currentDocumentId = "";
let currentDocumentName = "";
let loadedDocuments = [];
let pendingDeleteHistoryId = "";
let openHistoryMenuId = "";
let answerFeedbackTimeout = null;
let confirmAction = null;
let lastHistoryItems = [];
let historyPanelOpen = false;
let chatMessageSeq = 0;
let isAsking = false;
let currentAskController = null;
let currentTypingTimer = null;
let currentLoadingMessageId = "";

function getAuthToken() {
  try {
    return localStorage.getItem(AUTH_TOKEN_KEY) || sessionStorage.getItem(AUTH_TOKEN_KEY) || "";
  } catch (err) {
    return "";
  }
}

function setAuthToken(token) {
  try {
    localStorage.setItem(AUTH_TOKEN_KEY, token);
  } catch (err) {
    sessionStorage.setItem(AUTH_TOKEN_KEY, token);
  }
}

function clearAuthToken() {
  try {
    localStorage.removeItem(AUTH_TOKEN_KEY);
    sessionStorage.removeItem(AUTH_TOKEN_KEY);
  } catch (err) {
    sessionStorage.removeItem(AUTH_TOKEN_KEY);
  }
}

function authHeaders() {
  return {
    "Authorization": "Bearer " + getAuthToken()
  };
}

function showLogin() {
  document.getElementById('loginView').classList.remove('hidden');
  document.getElementById('appView').classList.add('hidden');
  document.getElementById('loginEmail').focus();
}

function showApp() {
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  initializeFreshAppState();
  restoreHistoryPanelState();
  loadAskHistory();
}

function toggleSessionMenu() {
  document.getElementById('sessionMenu').classList.toggle('hidden');
}

function toggleHistoryPanel() {
  historyPanelOpen = !historyPanelOpen;
  persistHistoryPanelState();
  renderHistoryPanel();
  document.getElementById('sessionMenu').classList.add('hidden');
  if (historyPanelOpen) {
    loadAskHistory();
  }
}

function closeHistoryPanel() {
  if (!historyPanelOpen) {
    return;
  }
  historyPanelOpen = false;
  persistHistoryPanelState();
  renderHistoryPanel();
}

function handleHistoryClickOutside(event) {
  if (!historyPanelOpen) {
    return;
  }
  if (!window.matchMedia("(max-width: 760px)").matches) {
    return;
  }
  const panel = document.getElementById('historyPanel');
  if (!panel) {
    return;
  }
  if (!panel.contains(event.target)) {
    closeHistoryPanel();
  }
}

function restoreHistoryPanelState() {
  try {
    historyPanelOpen = sessionStorage.getItem(HISTORY_PANEL_OPEN_KEY) === "true";
  } catch (err) {
    historyPanelOpen = false;
  }
  renderHistoryPanel();
}

function persistHistoryPanelState() {
  try {
    sessionStorage.setItem(HISTORY_PANEL_OPEN_KEY, historyPanelOpen ? "true" : "false");
  } catch (err) {}
}

function renderHistoryPanel() {
  const workspace = document.getElementById('workspace');
  const panel = document.getElementById('historyPanel');
  workspace.classList.toggle('history-open', historyPanelOpen);
  panel.classList.toggle('hidden-desktop', !historyPanelOpen);
}

async function login() {
  const container = document.getElementById('loginResult');
  container.innerHTML = "<p>Ingresando...</p>";

  try {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) {
      setMessage(container, "Completa email y contraseña.", "error");
      return;
    }

    const res = await fetch(API + "/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        tenant_id: TENANT_ID,
        email: email,
        password: password
      })
    });

    if (!res.ok) {
      setMessage(container, "No se pudo iniciar sesión.", "error");
      return;
    }

    const data = await res.json();
    if (!data.token) {
      setMessage(container, "No se pudo iniciar sesión.", "error");
      return;
    }

    setAuthToken(data.token);
    container.innerHTML = "";
    showApp();
  } catch (err) {
    setMessage(container, "No se pudo iniciar sesión.", "error");
  }
}

function logout() {
  document.getElementById('sessionMenu').classList.add('hidden');
  clearAuthToken();
  clearDocumentState();
  document.getElementById('askQuery').value = "";
  document.getElementById('historyResult').innerHTML = "";
  clearPersistedQueryState();
  showLogin();
}

function setMessage(container, message, className) {
  container.innerHTML = "";
  const p = document.createElement('p');
  p.textContent = message;
  if (className) {
    p.className = className;
  }
  container.appendChild(p);
}

function setLoadingState(container, message) {
  container.innerHTML = '<div class="loading-inline"><span>' + message + '</span><span class="loading-dots"><span></span><span></span><span></span></span></div>';
}

function chatContainer() {
  return document.getElementById('askResult');
}

function clearChatEmptyState() {
  const container = chatContainer();
  if (!container) return;
  const empty = container.querySelector('.chat-empty');
  if (empty) {
    empty.remove();
  }
}

function resetChatThread(message) {
  const container = chatContainer();
  if (!container) return;
  container.innerHTML = "";
  const empty = document.createElement('div');
  empty.className = "chat-empty";
  empty.textContent = message || "Haz una pregunta para iniciar la conversación.";
  container.appendChild(empty);
}

function scrollChatToBottom() {
  const container = chatContainer();
  if (!container) return;
  requestAnimationFrame(function () {
    container.scrollTop = container.scrollHeight;
  });
}

function appendChatMessage(role, content, options) {
  const container = chatContainer();
  if (!container) return "";
  clearChatEmptyState();

  const id = "chat-message-" + (++chatMessageSeq);
  const message = document.createElement('div');
  message.className = "chat-message " + role;
  message.id = id;

  const bubble = document.createElement('div');
  bubble.className = "chat-bubble";

  if (options && options.loading) {
    bubble.innerHTML = '<div class="loading-inline"><span>Escribiendo</span><span class="loading-dots"><span></span><span></span><span></span></span></div>';
  } else if (role === "assistant") {
    bubble.appendChild(renderAssistantContent(content, options && options.question));
  } else {
    const text = document.createElement('p');
    text.className = "chat-text";
    text.textContent = content || "";
    bubble.appendChild(text);
  }

  message.appendChild(bubble);
  container.appendChild(message);
  scrollChatToBottom();
  return id;
}

function replaceAssistantMessage(messageId, answer, question) {
  const message = document.getElementById(messageId);
  if (!message) {
    appendChatMessage("assistant", answer, { question: question });
    return;
  }
  const bubble = message.querySelector('.chat-bubble');
  if (!bubble) return;
  bubble.innerHTML = "";
  bubble.appendChild(renderAssistantContent(answer, question));
  scrollChatToBottom();
}

function delay(ms, signal) {
  return new Promise(function (resolve) {
    if (signal && signal.aborted) {
      resolve(false);
      return;
    }
    function finish(value) {
      if (currentTypingTimer) {
        clearTimeout(currentTypingTimer);
        currentTypingTimer = null;
      }
      if (signal) {
        signal.removeEventListener('abort', onAbort);
      }
      resolve(value);
    }
    function onAbort() {
      finish(false);
    }
    if (signal) {
      signal.addEventListener('abort', onAbort, { once: true });
    }
    currentTypingTimer = setTimeout(function () {
      finish(true);
    }, ms);
  });
}

async function replaceAssistantMessageTyping(messageId, answer, question, signal) {
  const message = document.getElementById(messageId);
  if (!message) {
    appendChatMessage("assistant", answer, { question: question });
    return;
  }
  const bubble = message.querySelector('.chat-bubble');
  if (!bubble) return;

  const finalAnswer = cleanDisplayedSources(answer || "");
  bubble.innerHTML = "";

  const text = document.createElement('p');
  text.className = "chat-text";
  const textNode = document.createTextNode("");
  const cursor = document.createElement('span');
  cursor.className = "typing-cursor";
  cursor.textContent = "|";
  text.appendChild(textNode);
  text.appendChild(cursor);
  bubble.appendChild(text);

  const chunkSize = finalAnswer.length > 2500 ? 12 : 8;
  const delayMs = finalAnswer.length > 2500 ? 8 : 12;

  for (let index = 0; index < finalAnswer.length; index += chunkSize) {
    if (signal && signal.aborted) {
      return false;
    }
    textNode.nodeValue += finalAnswer.slice(index, index + chunkSize);
    scrollChatToBottom();
    const shouldContinue = await delay(delayMs, signal);
    if (!shouldContinue || (signal && signal.aborted)) {
      return false;
    }
  }

  currentTypingTimer = null;
  bubble.innerHTML = "";
  bubble.appendChild(renderAssistantContent(finalAnswer, question));
  scrollChatToBottom();
  return true;
}

function renderAssistantContent(answer, question) {
  answer = cleanDisplayedSources(answer || "");
  const wrapper = document.createElement('div');
  wrapper.className = "answer-panel";
  wrapper.appendChild(buildFormattedAnswer(answer, question));

  const actions = document.createElement('div');
  actions.className = "answer-actions";

  const copyButton = document.createElement('button');
  copyButton.type = "button";
  copyButton.className = "answer-action";
  copyButton.textContent = "Copiar";
  actions.appendChild(copyButton);

  const exportButton = document.createElement('button');
  exportButton.type = "button";
  exportButton.className = "answer-action";
  exportButton.textContent = "Exportar";
  actions.appendChild(exportButton);

  const feedback = document.createElement('div');
  feedback.className = "answer-feedback";

  copyButton.onclick = function () {
    copyAnswer(answer, feedback);
  };
  exportButton.onclick = function () {
    exportAnswer(answer, question, feedback);
  };

  wrapper.appendChild(actions);
  wrapper.appendChild(feedback);
  return wrapper;
}

function formatHistoryDate(value) {
  if (!value) {
    return "";
  }
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) {
    return value;
  }
  return date.toLocaleString();
}

function cleanErrorText(text) {
  return (text || "").replace(/\s+/g, " ").trim();
}

function friendlyErrorText(text, defaultText) {
  const cleaned = cleanErrorText(text);
  if (!cleaned) {
    return defaultText;
  }
  const lower = cleaned.toLowerCase();
  if (
    lower.includes("openai") ||
    lower.includes("api_key") ||
    lower.includes("token") ||
    lower.includes("stack") ||
    lower.includes("internal") ||
    lower.includes("bad gateway") ||
    lower.includes("ia")
  ) {
    return defaultText;
  }
  if (cleaned.includes("Formato de archivo no soportado")) {
    return "Formato de archivo no soportado.";
  }
  if (cleaned.includes("tamaño máximo")) {
    return "El archivo supera el tamaño máximo permitido.";
  }
  return defaultText;
}

function escapeHtml(text) {
  return String(text || "").replace(/[&<>\"']/g, function (char) {
    switch (char) {
      case "&":
        return "&amp;";
      case "<":
        return "&lt;";
      case ">":
        return "&gt;";
      case "\"":
        return "&quot;";
      case "'":
        return "&#39;";
      default:
        return char;
    }
  });
}

function saveCurrentDocument(documentId, documentName) {
  currentDocumentId = documentId || "";
  if (currentDocumentId) {
    currentDocumentName = documentName || "Documento cargado";
    loadedDocuments = [{ id: currentDocumentId, name: currentDocumentName }];
  } else {
    currentDocumentName = "";
    loadedDocuments = [];
  }
  saveLoadedDocuments();
  try {
    if (currentDocumentId) {
      sessionStorage.setItem(CURRENT_DOCUMENT_ID_KEY, currentDocumentId);
      sessionStorage.setItem(CURRENT_DOCUMENT_NAME_KEY, currentDocumentName);
    } else {
      sessionStorage.removeItem(CURRENT_DOCUMENT_ID_KEY);
      sessionStorage.removeItem(CURRENT_DOCUMENT_NAME_KEY);
    }
  } catch (err) {}
}

function saveLoadedDocuments() {
  try {
    if (loadedDocuments.length) {
      sessionStorage.setItem(CURRENT_DOCUMENTS_KEY, JSON.stringify(loadedDocuments));
    } else {
      sessionStorage.removeItem(CURRENT_DOCUMENTS_KEY);
    }
  } catch (err) {}
}

function syncCurrentDocumentFromList() {
  if (loadedDocuments.length) {
    currentDocumentId = loadedDocuments[0].id || "";
    currentDocumentName = loadedDocuments[0].name || "Documento cargado";
  } else {
    currentDocumentId = "";
    currentDocumentName = "";
  }
  saveLoadedDocuments();
  try {
    if (currentDocumentId) {
      sessionStorage.setItem(CURRENT_DOCUMENT_ID_KEY, currentDocumentId);
      sessionStorage.setItem(CURRENT_DOCUMENT_NAME_KEY, currentDocumentName);
    } else {
      sessionStorage.removeItem(CURRENT_DOCUMENT_ID_KEY);
      sessionStorage.removeItem(CURRENT_DOCUMENT_NAME_KEY);
    }
  } catch (err) {}
}

function restoreCurrentDocumentId() {
  currentDocumentId = "";
  currentDocumentName = "";
  loadedDocuments = [];
  renderCurrentDocumentName();
}

function initializeFreshAppState() {
  currentDocumentId = "";
  currentDocumentName = "";
  loadedDocuments = [];

  const fileInput = document.getElementById("file");
  if (fileInput) fileInput.value = "";

  const query = document.getElementById("askQuery");
  if (query) query.value = "";

  resetChatThread();

  clearPersistedDocumentState();
  clearPersistedQueryState();
  renderCurrentDocumentName();
  setUploadMessage("Consulta global en la base de conocimiento", false, "ready");
}

function clearDocumentState() {
  saveCurrentDocument("", "");
  resetChatThread();
  clearPersistedDocumentState();
  clearPersistedQueryState();
  persistLastAnswer("");
}

function resetUploadDocumentState() {
  currentDocumentId = "";
  currentDocumentName = "";
  loadedDocuments = [];
  saveCurrentDocument("", "");
  resetChatThread();
  persistLastAnswer("");
}

function persistQueryState() {
  return;
}

function restoreQueryState() {
  document.getElementById('askQuery').value = "";
}

function persistLastAnswer(answerText) {
  try {
    if (answerText) {
      sessionStorage.setItem(LAST_ANSWER_TEXT_KEY, answerText);
    } else {
      sessionStorage.removeItem(LAST_ANSWER_TEXT_KEY);
    }
  } catch (err) {}
}

function restoreLastAnswer() {
  resetChatThread();
}

function clearPersistedQueryState() {
  try {
    sessionStorage.removeItem(CURRENT_QUERY_TEXT_KEY);
    sessionStorage.removeItem(LAST_ANSWER_TEXT_KEY);
    localStorage.removeItem(CURRENT_QUERY_TEXT_KEY);
    localStorage.removeItem(LAST_ANSWER_TEXT_KEY);
  } catch (err) {}
}

function clearPersistedDocumentState() {
  try {
    sessionStorage.removeItem(CURRENT_DOCUMENT_ID_KEY);
    sessionStorage.removeItem(CURRENT_DOCUMENT_NAME_KEY);
    sessionStorage.removeItem(CURRENT_DOCUMENTS_KEY);
    localStorage.removeItem(CURRENT_DOCUMENT_ID_KEY);
    localStorage.removeItem(CURRENT_DOCUMENT_NAME_KEY);
    localStorage.removeItem(CURRENT_DOCUMENTS_KEY);
  } catch (err) {}
}

function clearCurrentChatStorage() {
  const exactKeys = [
    CURRENT_DOCUMENT_ID_KEY,
    CURRENT_DOCUMENT_NAME_KEY,
    CURRENT_DOCUMENTS_KEY,
    CURRENT_QUERY_TEXT_KEY,
    LAST_ANSWER_TEXT_KEY,
    "auradb.currentConversation",
    "auradb.currentChat",
    "auradb.lastQuestion",
    "auradb.lastDocumentId",
    "auradb.lastDocumentIds",
    "auradb.last_document_ids",
    "auradb.loadedDocuments",
    "auradb.activeDocumentIds"
  ];
  const relatedPatterns = [
    /^auradb\.current/i,
    /^auradb\.last/i,
    /^auradb\.loadedDocuments$/i,
    /^auradb\.activeDocumentIds$/i,
    /^auradb\.conversation/i
  ];

  [sessionStorage, localStorage].forEach(function (storage) {
    try {
      exactKeys.forEach(function (key) {
        storage.removeItem(key);
      });
      Object.keys(storage).forEach(function (key) {
        if (key === AUTH_TOKEN_KEY || key === HISTORY_FAVORITES_KEY || key === HISTORY_HIDDEN_IDS_KEY || key === HISTORY_PANEL_OPEN_KEY) {
          return;
        }
        if (relatedPatterns.some(function (pattern) { return pattern.test(key); })) {
          storage.removeItem(key);
        }
      });
    } catch (err) {}
  });
}

function startNewChat() {
  const menu = document.getElementById('sessionMenu');
  if (menu) {
    menu.classList.add('hidden');
  }
  closeHistoryMenu();
  if (isAsking && currentAskController) {
    currentAskController.abort();
  }
  if (currentTypingTimer) {
    clearTimeout(currentTypingTimer);
    currentTypingTimer = null;
  }
  if (answerFeedbackTimeout) {
    clearTimeout(answerFeedbackTimeout);
    answerFeedbackTimeout = null;
  }
  finishAskState();

  currentDocumentId = "";
  currentDocumentName = "";
  loadedDocuments = [];
  chatMessageSeq = 0;

  const fileInput = document.getElementById("file");
  if (fileInput) fileInput.value = "";

  const query = document.getElementById("askQuery");
  if (query) {
    query.value = "";
    query.style.height = "48px";
  }

  clearCurrentChatStorage();
  renderCurrentDocumentName();
  setUploadMessage("Nuevo chat iniciado. Puedes consultar la base de conocimiento o subir un documento.", false, "ready");
  resetChatThread("Nuevo chat iniciado. Puedes consultar la base de conocimiento o subir un documento.");

  if (query) {
    query.focus();
  }
}

function setQuickQuestion(mode) {
  const input = document.getElementById('askQuery');
  if (mode === "summary") {
    input.value = "Resume este documento";
  } else if (mode === "structure") {
    input.value = "¿Qué contiene el documento?";
  } else if (mode === "keypoints") {
    input.value = "Extrae los puntos clave";
  } else if (mode === "technical") {
    input.value = "Describe el flujo técnico";
  } else {
    input.value = "";
  }
  persistQueryState();
  input.focus();
}

function applyExampleQuestion(question) {
  const input = document.getElementById('askQuery');
  input.value = question || "";
  persistQueryState();
  input.focus();
}

function showAnswerFeedback(message, target) {
  const feedback = target || document.getElementById('answerFeedback');
  if (!feedback) {
    return;
  }
  feedback.textContent = message || "";
  if (answerFeedbackTimeout) {
    clearTimeout(answerFeedbackTimeout);
  }
  if (message) {
    answerFeedbackTimeout = setTimeout(function () {
      const currentFeedback = target || document.getElementById('answerFeedback');
      if (currentFeedback) {
        currentFeedback.textContent = "";
      }
    }, 2200);
  }
}

async function copyAnswer(answerText, feedbackTarget) {
  answerText = answerText || sessionStorage.getItem(LAST_ANSWER_TEXT_KEY) || "";
  if (!answerText) {
    return;
  }
  try {
    await navigator.clipboard.writeText(answerText);
    showAnswerFeedback("Copiado", feedbackTarget);
  } catch (err) {
    showAnswerFeedback("", feedbackTarget);
  }
}

function exportAnswer(answerText, question, feedbackTarget) {

function normalizeForIntent(text) {
  return String(text || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function detectAnswerIntent(question) {
  const normalized = normalizeForIntent(question);
  if (normalized.includes("flujo")) {
    return "flow";
  }
  if (normalized.includes("resume") || normalized.includes("resumen") || normalized.includes("explicame") || normalized.includes("explica") || normalized.includes("analiza")) {
    return "summary";
  }
  if (
    normalized.includes("que es") ||
    normalized.includes("define") ||
    normalized.includes("definicion") ||
    normalized.includes("que significa")
  ) {
    return "definition";
  }
  return "default";
}

function stripTechnicalHeading(text) {
  const cleaned = String(text || "")
    .replace(/^\s*(respuesta|respuesta generada|definicion|definición|contexto|analisis|análisis|contenido)\s*:\s*/i, "")
    .replace(/^\s*resumen del documento\s*:?\s*$/i, "")
    .trim();
  return normalizeRawUppercaseTitle(cleaned);
}

function uppercaseLetterRatio(text) {
  const letters = String(text || "").match(/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/g) || [];
  if (!letters.length) return 0;
  const upper = letters.filter(function (char) {
    return char === char.toUpperCase() && char !== char.toLowerCase();
  });
  return upper.length / letters.length;
}

function normalizeRawUppercaseTitle(text) {
  const cleaned = String(text || "").trim();
  if (!cleaned) return "";
  if (cleaned.length > 18 && cleaned.length < 160 && uppercaseLetterRatio(cleaned) > 0.78) {
    const normalized = normalizeForIntent(cleaned);
    if (normalized.includes("compendio") && normalized.includes("transporte")) {
      return "El texto presenta un compendio histórico sobre la evolución del transporte y la movilidad.";
    }
    if (normalized.includes("transporte") || normalized.includes("movilidad")) {
      return "El texto presenta una revisión general sobre transporte y movilidad.";
    }
    return cleaned.charAt(0).toUpperCase() + cleaned.slice(1).toLowerCase();
  }
  return cleaned;
}

function cleanAnswerText(text) {
  return cleanDisplayedSources(text)
    .replace(/\r/g, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function sourceDisplayNameForId(id) {
  const normalizedId = String(id || "").trim();
  if (!normalizedId) return "";
  const found = loadedDocuments.find(function (documentInfo) {
    return String(documentInfo.id || "").trim() === normalizedId;
  });
  return found && found.name ? found.name : "";
}

function fallbackSourceNames() {
  return loadedDocuments
    .map(function (documentInfo) { return documentInfo.name || ""; })
    .filter(Boolean);
}

function cleanSourceLine(line) {
  let cleaned = String(line || "");
  const original = cleaned;
  const sheetMatch = cleaned.match(/(?:hoja|sheet)\s*:?\s*([A-Za-z0-9_ -]+)/i);
  const sheetName = sheetMatch ? sheetMatch[1].trim() : "";

  loadedDocuments.forEach(function (documentInfo) {
    const id = String(documentInfo.id || "").trim();
    if (!id || !documentInfo.name) return;
    cleaned = cleaned.split(id).join(documentInfo.name);
  });

  cleaned = cleaned
    .replace(/\bchunk[_\s-]*id\s*[:=]?\s*[A-Za-z0-9_-]+/gi, "")
    .replace(/\bchunk\s*[:#-]?\s*[A-Za-z0-9_-]+/gi, "")
    .replace(/\bdocument[_\s-]*id\s*[:=]?\s*/gi, "")
    .replace(/\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/gi, "")
    .replace(/\s*[\/|]\s*(?=$)/g, "")
    .replace(/:\s*[,;]\s*/g, ": ")
    .replace(/\s*[,;]\s*(?=$)/g, "")
    .replace(/\s{2,}/g, " ")
    .replace(/\s+([,;])/g, "$1")
    .trim();

  if (/^fuentes?\s*:?\s*$/i.test(cleaned) || /^\[[A-Z]\]\s*$/i.test(cleaned)) {
    const names = fallbackSourceNames();
    if (names.length === 1) {
      cleaned = "Fuente: " + names[0];
    } else if (names.length > 1) {
      cleaned = "Fuente: " + names.join("; ");
    }
  }

  if (sheetName && !/hoja\s*:/i.test(cleaned)) {
    cleaned += " — Hoja: " + sheetName;
  }

  return cleaned || original;
}

function cleanDisplayedSources(text) {
  let inSources = false;
  return String(text || "")
    .split("\n")
    .map(function (line) {
      const isSourceHeader = /^\s*(?:fuentes?|(?:\[[A-Z]\]\s*)?fuente)\s*:?/i.test(line);
      const isSourceItem = inSources && /^\s*(?:\[[A-Z]\]\s*)?[^:]{0,140}(?:\.pdf|\.xlsx|\.xls|\.csv|\.docx|\.txt|\b[0-9a-f]{8}-)/i.test(line);
      const hasTechnicalSourceToken = /\bchunk[_\s-]*id\b/i.test(line) || /\b[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}\b/i.test(line);
      if (isSourceHeader) {
        inSources = true;
        return cleanSourceLine(line);
      }
      if (inSources && !line.trim()) {
        inSources = false;
        return line;
      }
      if (isSourceItem || hasTechnicalSourceToken) {
        return cleanSourceLine(line);
      }
      return line;
    })
    .join("\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

function splitSentences(text) {
  return String(text || "")
    .replace(/\n+/g, " ")
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [];
}

function splitIntoParagraphs(text) {
  const cleaned = cleanAnswerText(text);
  if (!cleaned) {
    return [];
  }

  const explicitParagraphs = cleaned
    .split(/\n\s*\n/)
    .map(function (part) { return stripTechnicalHeading(part); })
    .filter(Boolean);

  if (explicitParagraphs.length > 1) {
    return explicitParagraphs;
  }

  const sentences = cleaned
    .match(/[^.!?]+[.!?]+|[^.!?]+$/g)
    .map(function (part) { return stripTechnicalHeading(part); })
    .filter(Boolean);

  if (sentences.length <= 2) {
    return [stripTechnicalHeading(cleaned)];
  }

  const paragraphs = [];
  for (let i = 0; i < sentences.length; i += 2) {
    paragraphs.push(sentences.slice(i, i + 2).join(" "));
  }
  return paragraphs;
}

function splitSummaryAndConclusion(answer) {
  const sourceSplit = splitSourceBlocks(answer);
  const cleaned = cleanAnswerText(sourceSplit.body);
  const conclusionMatch = cleaned.match(/(?:^|\n)\s*(conclusi[oó]n)\s*:?\s*/i);
  if (conclusionMatch && typeof conclusionMatch.index === "number") {
    const summary = cleaned.slice(0, conclusionMatch.index).trim();
    const conclusion = cleaned.slice(conclusionMatch.index + conclusionMatch[0].length).trim();
    return {
      summary: splitIntoParagraphs(summary),
      conclusion: splitIntoParagraphs(conclusion),
      sources: sourceSplit.sources
    };
  }

  const paragraphs = splitIntoParagraphs(cleaned);
  if (paragraphs.length > 1) {
    return {
      summary: paragraphs.slice(0, -1),
      conclusion: [paragraphs[paragraphs.length - 1]],
      sources: sourceSplit.sources
    };
  }

  const sentences = splitSentences(cleaned)
    .map(function (sentence) { return stripTechnicalHeading(sentence); })
    .filter(Boolean);
  if (sentences.length > 1) {
    return {
      summary: sentences.slice(0, -1),
      conclusion: [sentences[sentences.length - 1]],
      sources: sourceSplit.sources
    };
  }

  return {
    summary: paragraphs.length ? paragraphs : [cleaned],
    conclusion: [],
    sources: sourceSplit.sources
  };
}

function splitLongSummarySections(answer) {
  const parts = splitSummaryAndConclusion(answer);
  const summary = parts.summary.slice();
  const intro = summary.length ? [summary.shift()] : [];
  const topicBullets = transportTopicBullets(summary.join("\n\n"));
  const development = summary;
  return {
    introduction: intro,
    development: development,
    topicBullets: topicBullets,
    conclusion: parts.conclusion,
    sources: parts.sources
  };
}

function splitFlowSteps(answer) {
  const cleaned = cleanAnswerText(answer);
  const lineItems = cleaned
    .split(/\n+/)
    .map(function (line) {
      return line.replace(/^\s*(?:\d+[\).\-\s]+|[-*]\s+)/, "").trim();
    })
    .filter(Boolean)
    .filter(function (line) {
      return !/^flujo del sistema\s*:?\s*$/i.test(line);
    });

  if (lineItems.length > 1) {
    return lineItems;
  }

  const steps = [];
  splitIntoParagraphs(cleaned).forEach(function (paragraph) {
    splitSentences(paragraph)
      .map(function (step) { return stripTechnicalHeading(step); })
      .filter(Boolean)
      .forEach(function (step) {
        steps.push(step);
      });
  });
  return steps.length ? steps : [cleaned];
}

function appendHeadingBlock(container, heading, paragraphs) {
  if (!paragraphs || !paragraphs.length) {
    return;
  }

  const block = document.createElement('div');
  block.className = "formatted-block";

  const title = document.createElement('h4');
  title.className = "formatted-heading";
  title.textContent = heading;
  block.appendChild(title);

  paragraphs.forEach(function (paragraph) {
    const p = document.createElement('p');
    p.className = "formatted-paragraph";
    p.textContent = paragraph;
    block.appendChild(p);
  });

  container.appendChild(block);
}

function appendListBlock(container, heading, items) {
  if (!items || !items.length) {
    return;
  }

  const block = document.createElement('div');
  block.className = "formatted-block";

  if (heading) {
    const title = document.createElement('h4');
    title.className = "formatted-heading";
    title.textContent = heading;
    block.appendChild(title);
  }

  const list = document.createElement('ul');
  list.className = "formatted-list";
  items.forEach(function (item) {
    const li = document.createElement('li');
    li.textContent = stripTechnicalHeading(item);
    list.appendChild(li);
  });
  block.appendChild(list);
  container.appendChild(block);
}

function appendMixedSummaryBlock(container, heading, paragraphs, topicBullets) {
  const cleanParagraphs = (paragraphs || []).map(stripTechnicalHeading).filter(Boolean);
  const listItems = [];
  const prose = [];

  cleanParagraphs.forEach(function (paragraph) {
    if (looksLikeListText(paragraph)) {
      extractBulletLines(paragraph).forEach(function (item) {
        listItems.push(item);
      });
      return;
    }
    prose.push(paragraph);
  });

  appendHeadingBlock(container, heading, prose);
  if (topicBullets && topicBullets.length) {
    topicBullets.forEach(function (item) {
      if (!listItems.includes(item)) {
        listItems.push(item);
      }
    });
  }
  if (listItems.length) {
    appendListBlock(container, prose.length ? "" : heading, listItems);
  }
}

function appendParagraphs(container, paragraphs) {
  paragraphs.forEach(function (paragraph) {
    const p = document.createElement('p');
    p.className = "formatted-paragraph";
    p.textContent = paragraph;
    container.appendChild(p);
  });
}

function buildFormattedAnswer(answer, question) {
  const intent = detectAnswerIntent(question);
  const container = document.createElement('div');
  container.className = "formatted-answer";
  const longAnswer = isLongFormattedAnswer(answer);
  if (longAnswer) {
    container.className += " long-answer";
  }

  if (intent === "summary") {
    if (longAnswer) {
      const parts = splitLongSummarySections(answer);
      appendHeadingBlock(container, "Introducción", parts.introduction);
      appendMixedSummaryBlock(container, "Desarrollo", parts.development, parts.topicBullets);
      if (parts.conclusion.length) {
        appendHeadingBlock(container, "Conclusión", parts.conclusion);
      }
      if (parts.sources.length) {
        appendHeadingBlock(container, "Fuente", parts.sources);
      }
      return container;
    }

    const parts = splitSummaryAndConclusion(answer);
    appendHeadingBlock(container, "Introducción", parts.summary);
    if (parts.conclusion.length) {
      appendHeadingBlock(container, "Conclusión", parts.conclusion);
    }
    if (parts.sources.length) {
      appendHeadingBlock(container, "Fuente", parts.sources);
    }
    return container;
  }

  if (intent === "flow") {
    const block = document.createElement('div');
    block.className = "formatted-block";

    const title = document.createElement('h4');
    title.className = "formatted-heading";
    title.textContent = "Flujo del sistema";
    block.appendChild(title);

    const list = document.createElement('ol');
    list.className = "formatted-list";
    splitFlowSteps(answer).forEach(function (step) {
      const item = document.createElement('li');
      item.textContent = step;
      list.appendChild(item);
    });
    block.appendChild(list);
    container.appendChild(block);
    return container;
  }

  appendParagraphs(container, splitIntoParagraphs(answer));
  return container;
}

function isLongFormattedAnswer(answer) {
  const cleaned = cleanAnswerText(answer);
  if (!cleaned) return false;
  const words = cleaned.split(/\s+/).filter(Boolean).length;
  const lineCount = cleaned.split(/\n+/).filter(function (line) { return line.trim(); }).length;
  return words >= 150 || lineCount >= 8 || splitIntoParagraphs(cleaned).length >= 4;
}

function splitSourceBlocks(answer) {
  const cleaned = cleanAnswerText(answer);
  const lines = cleaned.split("\n");
  const body = [];
  const sources = [];
  let inSources = false;

  lines.forEach(function (line) {
    if (/^\s*fuentes?\s*:/i.test(line)) {
      inSources = true;
      sources.push(stripTechnicalHeading(line));
      return;
    }
    if (inSources) {
      if (!line.trim()) {
        inSources = false;
        return;
      }
      sources.push(stripTechnicalHeading(line));
      return;
    }
    body.push(line);
  });

  return {
    body: body.join("\n").trim(),
    sources: sources.filter(Boolean)
  };
}

function extractBulletLines(text) {
  return String(text || "")
    .split(/\n+/)
    .map(function (line) {
      return line.replace(/^\s*(?:[-*•]\s+|\d+[\).\-\s]+)/, "").trim();
    })
    .filter(Boolean);
}

function looksLikeListText(text) {
  const lines = String(text || "").split(/\n+/).filter(function (line) { return line.trim(); });
  if (lines.length >= 3 && lines.filter(function (line) { return /^\s*(?:[-*•]\s+|\d+[\).\-\s]+)/.test(line); }).length >= 2) {
    return true;
  }
  return false;
}

function transportTopicBullets(text) {
  const normalized = normalizeForIntent(text);
  const topics = [
    { key: "navegacion", label: "Navegación", body: "amplía el alcance del transporte al conectar regiones por ríos, mares y rutas comerciales." },
    { key: "vapor", label: "Vapor", body: "marca una etapa de mecanización que incrementa velocidad, capacidad y regularidad en los desplazamientos." },
    { key: "rueda", label: "Rueda", body: "aparece como una innovación base para mejorar el transporte terrestre y la carga." },
    { key: "movilidad electrica", label: "Movilidad eléctrica", body: "representa la transición hacia sistemas menos dependientes de combustibles tradicionales." },
    { key: "traccion animal", label: "Tracción animal", body: "permite aumentar distancia y capacidad de transporte antes de la mecanización." },
    { key: "combustion", label: "Motor de combustión", body: "impulsa la movilidad moderna mediante automóviles, camiones y transporte flexible." },
    { key: "contenedor", label: "Contenedor intermodal", body: "ordena la logística moderna al facilitar el traslado entre barco, tren y camión." },
    { key: "alta velocidad", label: "Tren de alta velocidad", body: "resume el avance ferroviario orientado a mover pasajeros con mayor rapidez." },
    { key: "inteligencia artificial", label: "Autonomía e inteligencia artificial", body: "proyecta sistemas de transporte más automatizados, inteligentes y conectados." }
  ];

  const matches = topics.filter(function (topic) {
    return normalized.includes(topic.key);
  });

  if (matches.length < 3 || String(text || "").split(/\s+/).length < 80) {
    return [];
  }

  return matches.map(function (topic) {
    return topic.label + ": " + topic.body;
  });
}

async function uploadSelectedFile() {
  const input = document.getElementById("file");
  const files = input.files ? Array.from(input.files) : [];

  if (!files.length) {
    setUploadMessage("Selecciona uno o más archivos.", true);
    return;
  }

  const token = getAuthToken ? getAuthToken() : localStorage.getItem("token");

  if (!token) {
    setUploadMessage("No hay sesión activa. Inicia sesión de nuevo.", true);
    return;
  }

  let uploadedCount = 0;
  const explicitMultiDocumentUpload = files.length > 1;
  try {
    setUploadMessage(files.length === 1 ? "Procesando documento..." : "Procesando documentos...", false, "processing");
    clearPersistedDocumentState();
    loadedDocuments = [];
    currentDocumentId = "";
    currentDocumentName = "";
    renderCurrentDocumentName();

    for (const file of files) {
      const documentId = await uploadSingleFile(file, token);
      if (!explicitMultiDocumentUpload) {
        loadedDocuments = [];
      }
      addLoadedDocument({ id: documentId, name: file.name });
      currentDocumentId = documentId;
      currentDocumentName = file.name;
      uploadedCount++;
    }

    if (explicitMultiDocumentUpload) {
      syncCurrentDocumentFromList();
    } else if (loadedDocuments.length) {
      saveLoadedDocuments();
      try {
        sessionStorage.setItem(CURRENT_DOCUMENT_ID_KEY, currentDocumentId);
        sessionStorage.setItem(CURRENT_DOCUMENT_NAME_KEY, currentDocumentName);
      } catch (err) {}
    }

    renderCurrentDocumentName();
    console.log("active_document_after_upload=" + selectedDocumentIds().join(","));
    setUploadMessage(uploadedCount === 1 ? "Documento listo para consultar" : uploadedCount + " documentos listos para consultar", false, "ready");

  } catch (err) {
    console.error("upload error:", err);
    syncCurrentDocumentFromList();
    renderCurrentDocumentName();
    const partialMessage = uploadedCount > 0 ? uploadedCount + " documento(s) subido(s). " : "";
    setUploadMessage(partialMessage + "No se pudo subir el documento: " + err.message, true);
  } finally {
    if (input) input.value = "";
  }
}

async function uploadSingleFile(file, token) {
  const formData = new FormData();
  formData.append("file", file);

  const res = await fetch(API + "/api/documents/upload", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + token
    },
    body: formData
  });

  const text = await res.text();
  console.log("upload response:", file.name, res.status, text);

  if (!res.ok) {
    if (res.status === 401) {
      clearAuthToken();
      showLogin();
      throw new Error("Sesión inválida o expirada. Inicia sesión de nuevo.");
    }
    throw new Error(text || "Upload failed");
  }

  let documentId = "";
  try {
    const data = JSON.parse(text);
    documentId = data.id || data.document_id || "";
  } catch (err) {
    const match = text.match(/document_id=([0-9a-fA-F-]{36})/);
    documentId = match ? match[1] : "";
  }

  if (!documentId) {
    throw new Error("No se encontró document_id en la respuesta: " + text);
  }

  return documentId;
}

function syncStateFromVisibleDocuments() {

  loadedDocuments = visibleDocuments;

    currentDocumentName = visibleDocuments[0].name;
  } else if (visibleDocuments.length > 1) {
    currentDocumentId = visibleDocuments[0].id;
    currentDocumentName = visibleDocuments[0].name;
  } else {
    currentDocumentId = "";
    currentDocumentName = "";
  }
}

function visibleDocumentLogValue() {
  return visibleLoadedDocuments()
    .map(function (item) { return item.name + ":" + item.id; })
    .filter(Boolean);
}

function clearDocument() {
  currentDocumentId = "";
  currentDocumentName = "";
  loadedDocuments = [];
  const fileInput = document.getElementById("file");
  if (fileInput) fileInput.value = "";

  const query = document.getElementById("askQuery");
  if (query) query.value = "";

  clearPersistedDocumentState();
  clearPersistedQueryState();

  renderCurrentDocumentName();
  setUploadMessage("Consulta global en la base de conocimiento", false, "ready");

  resetChatThread();
}

function renderCurrentDocumentName() {
  const container = document.getElementById("currentDocumentName");
  const list = document.getElementById("documentList");
  if (!container) return;

  if (!loadedDocuments.length) {
    container.textContent = "Consulta global en la base de conocimiento";
    if (list) list.innerHTML = "";
    return;
  }

  container.textContent = loadedDocuments.length === 1 ? loadedDocuments[0].name : loadedDocuments.length + " documentos listos";

  if (!list) return;
  list.innerHTML = "";
  loadedDocuments.forEach(function (documentInfo) {
    const item = document.createElement("span");
    item.className = "document-pill";
    item.setAttribute("data-document-id", documentInfo.id || "");

    const name = document.createElement("span");
    name.className = "document-pill-name";
    name.textContent = documentInfo.name || "Documento cargado";
    item.appendChild(name);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "document-remove";
    remove.setAttribute("aria-label", "Quitar documento");
    remove.textContent = "×";
    remove.onclick = function () {
      removeLoadedDocument(documentInfo.id);
    };
    item.appendChild(remove);

    list.appendChild(item);
  });
}

function setUploadMessage(message, isError, state) {
  const el = document.getElementById("uploadResult");
  if (!el) return;
  el.textContent = message;
  if (isError) {
    el.className = "status error";
    return;
  }
  el.className = state ? "status " + state : "status";
}

async function searchDocs() {
  return askDocument();
}

function setAskingState(active) {
  isAsking = active;
  const askButton = document.getElementById('askButton');
  if (!askButton) return;
  askButton.textContent = active ? "Parar" : "Enviar";
  askButton.setAttribute("aria-label", active ? "Parar respuesta" : "Enviar consulta");
}

function finishAskState() {
  isAsking = false;
  currentAskController = null;
  currentTypingTimer = null;
  currentLoadingMessageId = "";
  setAskingState(false);
}

function stopCurrentAsk() {
  if (!isAsking) {
    return;
  }
  if (currentAskController) {
    currentAskController.abort();
  }
  if (currentTypingTimer) {
    clearTimeout(currentTypingTimer);
    currentTypingTimer = null;
  }
  const messageId = currentLoadingMessageId;
  finishAskState();
  if (messageId) {
    replaceAssistantMessage(messageId, "Respuesta detenida.", document.getElementById('askQuery').value.trim());
  } else {
    appendChatMessage("assistant", "Respuesta detenida.");
  }
}

function handleAskButtonClick() {
  if (isAsking) {
    stopCurrentAsk();
    return;
  }
  askDocument();
}

async function askDocument() {
  const container = document.getElementById('askResult');
  let loadingMessageId = "";
  let question = "";
  if (isAsking) {
    return;
  }
  try {
    const queryInput = document.getElementById('askQuery');
    question = queryInput.value.trim();
    syncStateFromVisibleDocuments();
    const documentIds = selectedDocumentIds();
    if (!question) {
      appendChatMessage("assistant", "Escribe una consulta.");
      return;
    }
    if (!getAuthToken()) {
      appendChatMessage("assistant", "No hay sesión activa. Inicia sesión de nuevo.");
      return;
    }
    const globalKnowledgeMode = documentIds.length === 0;
    if (globalKnowledgeMode) {
      console.log("global_knowledge_mode_frontend=true");
      setUploadMessage("Consulta global en la base de conocimiento", false, "ready");
    }

    persistQueryState();
    persistLastAnswer("");
    currentAskController = new AbortController();
    const askController = currentAskController;
    setAskingState(true);
    appendChatMessage("user", question);
    queryInput.value = "";
    queryInput.style.height = "48px";
    clearPersistedQueryState();
    queryInput.focus();
    loadingMessageId = appendChatMessage("assistant", "", { loading: true });
    currentLoadingMessageId = loadingMessageId;
    console.log("visible_documents_before_ask=" + visibleDocumentLogValue().join(","));
    console.log("ask_document_id=" + (documentIds.length === 1 ? documentIds[0] : ""));
    console.log("ask_document_ids=" + documentIds.join(","));

    let url = API + "/ask?q=" + encodeURIComponent(question) + "&top_k=3";
    if (documentIds.length > 1) {
      url += "&document_ids=" + encodeURIComponent(documentIds.join(","));
    } else if (documentIds.length === 1) {
      url += "&document_id=" + encodeURIComponent(documentIds[0]);
    }
    if (documentIds.length === 1) {
      saveCurrentDocument(documentIds[0], currentDocumentName);
    } else if (documentIds.length > 1) {
      saveLoadedDocuments();
    }
    const res = await fetch(url, {
      method: "GET",
      headers: authHeaders(),
      signal: askController.signal
    });

    if (!res.ok) {
      await replaceAssistantMessageTyping(loadingMessageId, "No se encontró información suficiente en el documento para responder esa consulta.", question, askController.signal);
      return;
    }

    const data = await res.json();
    const completedTyping = await replaceAssistantMessageTyping(loadingMessageId, data.answer || "", question, askController.signal);
    if (!completedTyping) {
      return;
    }
    persistLastAnswer(data.answer || "");
    loadAskHistory();
  } catch (err) {
    if (err && err.name === "AbortError") {
      if (loadingMessageId && document.getElementById(loadingMessageId)) {
        replaceAssistantMessage(loadingMessageId, "Respuesta detenida.", question);
      }
      return;
    }
    await replaceAssistantMessageTyping(loadingMessageId, "No se encontró información suficiente en el documento para responder esa consulta.", question, null);
  } finally {
    finishAskState();
  }
}

async function deleteHistoryItem(id) {
  if (!id) {
    return;
  }
  closeHistoryMenu();
  pendingDeleteHistoryId = id;
  confirmAction = "delete-single";
  openConfirmModal("¿Seguro que quieres eliminar esta pregunta del historial?");
}

function requestClearHistory() {
  closeHistoryMenu();
  confirmAction = "clear-history";
  openConfirmModal("¿Seguro que quieres vaciar el historial?");
}

function openConfirmModal(message) {
  document.getElementById('confirmModalText').textContent = message || "¿Seguro que quieres eliminar esta pregunta del historial?";
  document.getElementById('confirmModal').classList.remove('hidden');
}

function closeConfirmModal() {
  pendingDeleteHistoryId = "";
  confirmAction = null;
  document.getElementById('confirmModal').classList.add('hidden');
}

async function confirmDeleteHistory() {
  const id = pendingDeleteHistoryId;
  if (confirmAction === "clear-history") {
    closeConfirmModal();
    setFavoriteHistoryIds([]);
    setHiddenHistoryIds(lastHistoryItems.map(function (item) { return item.id; }).filter(Boolean));
    lastHistoryItems = [];
    renderHistoryList(lastHistoryItems);
    return;
  }
  if (!id) {
    closeConfirmModal();
    return;
  }
  closeConfirmModal();

  const container = document.getElementById('historyResult');
  try {
    const res = await fetch(API + "/ask/history/" + encodeURIComponent(id), {
      method: "DELETE",
      headers: authHeaders()
    });

    if (!res.ok) {
      const text = await res.text();
      setMessage(container, friendlyErrorText(text, "No se pudo eliminar la pregunta."), "error");
      return;
    }

    await loadAskHistory();
  } catch (err) {
    setMessage(container, "No se pudo eliminar la pregunta.", "error");
  }
}

function sortHistoryItems(items) {
  return items.slice().sort(function (a, b) {
    const aFav = isHistoryFavorite(a.id || "") ? 1 : 0;
    const bFav = isHistoryFavorite(b.id || "") ? 1 : 0;
    if (aFav !== bFav) {
      return bFav - aFav;
    }
    return new Date(b.created_at || 0) - new Date(a.created_at || 0);
  });
}

function renderHistoryList(items) {
  const container = document.getElementById('historyResult');
  container.innerHTML = "";

  const hiddenIds = getHiddenHistoryIds();
  const visibleItems = sortHistoryItems((items || []).filter(function (item) {
    return item && item.id && !hiddenIds.includes(item.id);
  }));

  if (!visibleItems.length) {
    setMessage(container, "No hay preguntas guardadas.", "muted");
    return;
  }

  visibleItems.slice(0, 20).forEach(function (item) {
    const div = document.createElement('div');
    div.className = "history-card";

    const head = document.createElement('div');
    head.className = "history-head";

    const question = document.createElement('p');
    question.className = "history-question";
    question.textContent = item.question || "Pregunta sin texto";
    head.appendChild(question);

    const menuWrap = document.createElement('div');
    menuWrap.className = "history-item-menu";

    const favoriteButton = document.createElement('button');
    favoriteButton.type = "button";
    favoriteButton.className = "history-favorite" + (isHistoryFavorite(item.id || "") ? " active" : "");
    favoriteButton.textContent = "★";
    favoriteButton.setAttribute("aria-label", "Favorito");
    favoriteButton.onclick = function (event) {
      event.stopPropagation();
      toggleHistoryFavorite(item.id || "");
    };
    menuWrap.appendChild(favoriteButton);

    const menuButton = document.createElement('button');
    menuButton.type = "button";
    menuButton.className = "history-menu-button";
    menuButton.textContent = "⋯";
    menuButton.setAttribute("aria-label", "Opciones");
    menuButton.onclick = function (event) {
      event.stopPropagation();
      toggleHistoryMenu(item.id || "");
    };
    menuWrap.appendChild(menuButton);

    const contextMenu = document.createElement('div');
    contextMenu.className = "history-context-menu hidden";
    contextMenu.setAttribute("data-history-menu", item.id || "");

    const useOption = document.createElement('button');
    useOption.type = "button";
    useOption.className = "secondary-button";
    useOption.textContent = "Usar";
    useOption.onclick = function () {
      useHistoryQuestion(item.question || "", item.document_id || "");
    };

    const favoriteOption = document.createElement('button');
    favoriteOption.type = "button";
    favoriteOption.className = "secondary-button";
    favoriteOption.textContent = isHistoryFavorite(item.id || "") ? "Quitar favorito" : "Marcar favorito";
    favoriteOption.onclick = function () {
      toggleHistoryFavorite(item.id || "");
    };

    const deleteOption = document.createElement('button');
    deleteOption.type = "button";
    deleteOption.className = "danger-button";
    deleteOption.textContent = "Eliminar";
    deleteOption.style.marginTop = "4px";
    deleteOption.onclick = function () {
      deleteHistoryItem(item.id || "");
    };

    contextMenu.appendChild(useOption);
    contextMenu.appendChild(favoriteOption);
    contextMenu.appendChild(deleteOption);
    menuWrap.appendChild(contextMenu);
    head.appendChild(menuWrap);
    div.appendChild(head);

    const meta = document.createElement('div');
    meta.className = "history-meta";
    meta.textContent = formatHistoryDate(item.created_at || "");
    div.appendChild(meta);

    container.appendChild(div);
  });

  renderHistoryMenus();
}

async function loadAskHistory() {
  const container = document.getElementById('historyResult');
  setLoadingState(container, "Cargando historial");

  try {
    const res = await fetch(API + "/ask/history", {
      method: "GET",
      headers: authHeaders()
    });

    if (!res.ok) {
      const text = await res.text();
      setMessage(container, friendlyErrorText(text, "No se pudo cargar el historial."), "error");
      return;
    }

    const data = await res.json();
    lastHistoryItems = Array.isArray(data) ? data : [];
    renderHistoryList(lastHistoryItems);
  } catch (err) {
    setMessage(container, "No se pudo cargar el historial.", "error");
  }
}

document.getElementById('loginPassword').addEventListener('keydown', function (event) {
  if (event.key === "Enter") {
    login();
  }
});

document.getElementById('askQuery').addEventListener('keydown', function (event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    if (isAsking) {
      return;
    }
    askDocument();
  }
});

document.getElementById('askQuery').addEventListener('input', function () {
  this.style.height = "48px";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";
  persistQueryState();
});

document.getElementById("uploadButton").addEventListener("click", function () {
  document.getElementById("file").click();
});

document.getElementById("file").addEventListener("change", uploadSelectedFile);

const clearButton = document.getElementById("clearButton");
if (clearButton) {
  clearButton.addEventListener("click", clearDocument);
}

document.addEventListener("mousedown", handleHistoryClickOutside);

document.addEventListener('click', function (event) {
  const menu = document.getElementById('sessionMenu');
  const menuArea = document.querySelector('.topbar-actions');
  if (!menuArea.contains(event.target)) {
    menu.classList.add('hidden');
  }
  const historyMenuTarget = event.target.closest('.history-item-menu');
  if (!historyMenuTarget) {
    closeHistoryMenu();
  }
  const modal = document.getElementById('confirmModal');
  if (!modal.classList.contains('hidden') && event.target === modal) {
    closeConfirmModal();
  }
});

if (getAuthToken()) {
  showApp();
} else {
  showLogin();
}
</script>
