version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: auradb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: auradb
      POSTGRES_USER: auradb
      POSTGRES_PASSWORD: auradb123
    ports:
      - "5432:5432"

  nats:
    image: nats:2.10-alpine
    container_name: auradb-nats
    command: ["-js"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:latest
    container_name: auradb-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"